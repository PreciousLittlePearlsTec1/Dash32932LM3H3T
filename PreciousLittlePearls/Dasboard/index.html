<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard</title>
  <link rel="stylesheet" href="./style.css" />
</head>

<body>

<div id="loader">
  <div class="spinner"></div>
  <p>Loading...</p>
</div>

<main class="container">

  <h1>Dashboard</h1>

  <div class="clock">
    <div id="time">00:00:00</div>
    <div id="date">...</div>
  </div>

  <div class="searchBox">
    <input id="searchInput" placeholder="Search or URL..." />
    <button id="searchBtn">Search</button>
  </div>

</main>

<script src="./js/app.js"></script>
</body>
</html>
